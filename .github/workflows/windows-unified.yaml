name: Complete 4.7 Secure Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-editor:
    name: Build Windows + Web Secure Editor/Templates
    runs-on: windows-2025

    env:
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_SECURE_KEY }}
      MAGIC_HEADER: ${{ secrets.MAGIC_HEADER }}
      ENCRYPTED_HEADER: ${{ secrets.ENCRYPTED_HEADER }}

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ============================================================
      # CHECKOUT GODOT 4.7
      # ============================================================
      - name: Checkout Godot 4.7
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7
          submodules: recursive
          path: godot

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # SCONS
      # ============================================================
      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade scons

          python --version
          scons --version

      # ============================================================
      # EMSCRIPTEN
      # ============================================================
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.0
          actions-cache-folder: emsdk-cache

      # ============================================================
      # VERIFY EMSCRIPTEN
      # ============================================================
      - name: Verify Emscripten
        shell: pwsh
        run: |
          Write-Host "Emscripten version:"
          emcc --version

          Write-Host ""
          Write-Host "Emscripten compiler:"
          Get-Command emcc

      # ============================================================
      # DOWNLOAD GODOT SECURE V6
      # ============================================================
      - name: Download Godot Secure v6
        shell: pwsh
        run: |
          $url = "https://github.com/KnifeXRage/Godot-Secure/releases/download/v6.0-Released-Universal/Godot.Secure.AES-256.Universal.v6.py"
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"

          Write-Host "Downloading Godot Secure v6..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $script

          if (-not (Test-Path $script)) {
            Write-Error "Godot Secure script was not downloaded."
            exit 1
          }

          Write-Host "Godot Secure downloaded successfully."

      # ============================================================
      # VALIDATE SECRETS
      # ============================================================
      - name: Validate required secrets
        shell: pwsh
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:SCRIPT_AES256_ENCRYPTION_KEY)) {
            $missing += "GODOT_SECURE_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:MAGIC_HEADER)) {
            $missing += "MAGIC_HEADER"
          }

          if ([string]::IsNullOrWhiteSpace($env:ENCRYPTED_HEADER)) {
            $missing += "ENCRYPTED_HEADER"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required secret(s): $($missing -join ', ')"
            exit 1
          }

          Write-Host "All required secrets are present."

      # ============================================================
      # VALIDATE MAGIC HEADERS
      # ============================================================
      - name: Validate magic headers
        shell: pwsh
        run: |
          if ($env:MAGIC_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "MAGIC_HEADER must contain only letters and numbers."
            exit 1
          }

          if ($env:ENCRYPTED_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "ENCRYPTED_HEADER must contain only letters and numbers."
            exit 1
          }

          Write-Host "Magic headers passed validation."

      # ============================================================
      # ACCESSKIT
      # ============================================================
      - name: Install AccessKit dependencies
        shell: pwsh
        working-directory: godot
        run: |
          python misc/scripts/install_accesskit.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "AccessKit installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "AccessKit installation completed."

      # ============================================================
      # DIRECT3D 12 SDK
      # ============================================================
      - name: Install Direct3D 12 SDK dependencies
        shell: pwsh
        working-directory: godot
        run: |
          python misc/scripts/install_d3d12_sdk_windows.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Direct3D 12 SDK installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "Direct3D 12 SDK installation completed."

      # ============================================================
      # GODOT SECURE
      # ============================================================
      - name: Run Godot Secure v6
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"
          $godot = "$env:GITHUB_WORKSPACE\godot"

          Write-Host "Starting Godot Secure v6..."
          Write-Host "Source directory: $godot"

          $answers = @(
            "y"
            "y"
            $env:MAGIC_HEADER
            $env:ENCRYPTED_HEADER
            "n"
            "n"
            "n"
          ) -join "`n"

          $answers | python -X utf8 $script $godot

          $exitCode = $LASTEXITCODE

          Write-Host "Godot Secure exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "Godot Secure failed with exit code $exitCode"
            exit $exitCode
          }

          Write-Host "Godot Secure completed successfully."

      # ============================================================
      # BUILD WINDOWS EDITOR
      # ============================================================
      - name: Build Windows Editor
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building Windows non-Mono editor"
          Write-Host "========================================"

          scons `
            platform=windows `
            target=editor `
            production=yes `
            -j2

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Windows editor build failed."
            exit $exitCode
          }

          Write-Host "Windows editor build completed."

      # ============================================================
      # VERIFY WINDOWS EDITOR
      # ============================================================
      - name: Verify Windows Editor
        shell: pwsh
        working-directory: godot
        run: |
          $editor = ".\bin\godot.windows.editor.x86_64.exe"
          $console = ".\bin\godot.windows.editor.x86_64.console.exe"

          if (-not (Test-Path $editor)) {
            Write-Error "Editor was not found: $editor"
            exit 1
          }

          if (-not (Test-Path $console)) {
            Write-Error "Console editor was not found: $console"
            exit 1
          }

          Write-Host "Windows editor binaries verified."

      # ============================================================
      # BUILD WINDOWS RELEASE TEMPLATE
      # ============================================================
      - name: Build Windows Release Template
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building Windows release template"
          Write-Host "========================================"

          scons `
            platform=windows `
            target=template_release `
            production=yes `
            -j2

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Windows release template build failed."
            exit $exitCode
          }

          Write-Host "Windows release template completed."

      # ============================================================
      # VERIFY WINDOWS RELEASE TEMPLATE
      # ============================================================
      - name: Verify Windows Release Template
        shell: pwsh
        working-directory: godot
        run: |
          $template = ".\bin\godot.windows.template_release.x86_64.exe"
          $templateConsole = ".\bin\godot.windows.template_release.x86_64.console.exe"

          if (-not (Test-Path $template)) {
            Write-Error "Windows release template was not found: $template"
            exit 1
          }

          if (-not (Test-Path $templateConsole)) {
            Write-Error "Windows console release template was not found: $templateConsole"
            exit 1
          }

          Write-Host "Windows release templates verified."

      # ============================================================
      # BUILD WEB RELEASE TEMPLATE
      # ============================================================
      - name: Build Web Release Template
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building Web release template"
          Write-Host "========================================"

          scons `
            platform=web `
            target=template_release `
            production=yes `
            -j2

          $exitCode = $LASTEXITCODE

          Write-Host "SCons exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "Web release template build failed."
            exit $exitCode
          }

          Write-Host "Web release template build completed."

      # ============================================================
      # VERIFY WEB TEMPLATE
      # ============================================================
      - name: Verify Web Release Template
        shell: pwsh
        working-directory: godot
        run: |
          $source = ".\bin\godot.web.template_release.wasm32.zip"
          $destination = ".\bin\web_release.zip"

          if (-not (Test-Path $source)) {
            Write-Error "Web release template was not found: $source"
            exit 1
          }

          Write-Host "Web template found:"
          Get-Item $source | Select-Object FullName, Length, LastWriteTime

          if (Test-Path $destination) {
            Remove-Item -Force $destination
          }

          Rename-Item `
            -Path $source `
            -NewName "web_release.zip"

          if (-not (Test-Path $destination)) {
            Write-Error "Failed to create web_release.zip"
            exit 1
          }

          Write-Host ""
          Write-Host "Web release template:"
          Get-Item $destination | Select-Object FullName, Length, LastWriteTime

      # ============================================================
      # PREPARE EDITOR PACKAGE
      # ============================================================
      - name: Prepare Editor Package
        shell: pwsh
        working-directory: godot
        run: |
          $package = "$env:GITHUB_WORKSPACE\godot-editor-package"

          if (Test-Path $package) {
            Remove-Item -Recurse -Force $package
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          Copy-Item `
            ".\bin\godot.windows.editor.x86_64.exe" `
            $package

          Copy-Item `
            ".\bin\godot.windows.editor.x86_64.console.exe" `
            $package

          Write-Host "Editor package:"
          Get-ChildItem `
            -Path $package `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ============================================================
      # PREPARE WINDOWS TEMPLATE PACKAGE
      # ============================================================
      - name: Prepare Windows Template Package
        shell: pwsh
        working-directory: godot
        run: |
          $package = "$env:GITHUB_WORKSPACE\godot-windows-template-package"

          if (Test-Path $package) {
            Remove-Item -Recurse -Force $package
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          Copy-Item `
            ".\bin\godot.windows.template_release.x86_64.exe" `
            $package

          Copy-Item `
            ".\bin\godot.windows.template_release.x86_64.console.exe" `
            $package

          Write-Host "Windows template package:"
          Get-ChildItem `
            -Path $package `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ============================================================
      # PREPARE WEB TEMPLATE PACKAGE
      # ============================================================
      - name: Prepare Web Template Package
        shell: pwsh
        working-directory: godot
        run: |
          $package = "$env:GITHUB_WORKSPACE\godot-web-template-package"

          if (Test-Path $package) {
            Remove-Item -Recurse -Force $package
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          Copy-Item `
            ".\bin\web_release.zip" `
            $package

          Write-Host "Web template package:"
          Get-ChildItem `
            -Path $package `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ============================================================
      # UPLOAD EDITOR
      # ============================================================
      - name: Upload Editor
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-secure-windows-editor
          path: godot-editor-package
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD WINDOWS TEMPLATES
      # ============================================================
      - name: Upload Windows Release Templates
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-secure-windows-release-templates
          path: godot-windows-template-package
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD WEB TEMPLATE
      # ============================================================
      - name: Upload Web Release Template
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-secure-web-release-template
          path: godot-web-template-package
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # SUMMARY
      # ============================================================
      - name: Build Summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Godot branch: 4.7"
          Write-Host "Windows editor: YES"
          Write-Host "Windows release template: YES"
          Write-Host "Web release template: YES"
          Write-Host "Mono: Disabled"
          Write-Host ""
          Write-Host "Artifacts:"
          Write-Host "  godot-4.7-secure-windows-editor"
          Write-Host "  godot-4.7-secure-windows-release-templates"
          Write-Host "  godot-4.7-secure-web-release-template"
          Write-Host ""
          Write-Host "Web template:"
          Write-Host "  bin\web_release.zip"
          Write-Host ""
          Write-Host "========================================"
