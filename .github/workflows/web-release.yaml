name: Build Secure Godot 4.7 Web Release Template

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web-release:
    name: Build Web Release Template
    runs-on: windows-2025

    env:
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_SECURE_KEY }}
      MAGIC_HEADER: ${{ secrets.MAGIC_HEADER }}
      ENCRYPTED_HEADER: ${{ secrets.ENCRYPTED_HEADER }}

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Godot 4.7
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7
          submodules: recursive
          path: godot

      # ============================================================
      # .NET SDK
      # ============================================================

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info

      # ============================================================
      # PYTHON / SCONS
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade scons

      # ============================================================
      # DOWNLOAD GODOT SECURE
      # ============================================================

      - name: Download Godot Secure v6
        shell: pwsh
        run: |
          $url = "https://github.com/KnifeXRage/Godot-Secure/releases/download/v6.0-Released-Universal/Godot.Secure.AES-256.Universal.v6.py"
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $script

          if (-not (Test-Path $script)) {
            Write-Error "Godot Secure script was not downloaded."
            exit 1
          }

      # ============================================================
      # VALIDATE SECRETS
      # ============================================================

      - name: Validate required secrets
        shell: pwsh
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:SCRIPT_AES256_ENCRYPTION_KEY)) {
            $missing += "GODOT_SECURE_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:MAGIC_HEADER)) {
            $missing += "MAGIC_HEADER"
          }

          if ([string]::IsNullOrWhiteSpace($env:ENCRYPTED_HEADER)) {
            $missing += "ENCRYPTED_HEADER"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required secret(s): $($missing -join ', ')"
            exit 1
          }

      - name: Validate magic headers
        shell: pwsh
        run: |
          if ($env:MAGIC_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "MAGIC_HEADER must contain only letters and numbers."
            exit 1
          }

          if ($env:ENCRYPTED_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "ENCRYPTED_HEADER must contain only letters and numbers."
            exit 1
          }

      # ============================================================
      # EMSCRIPTEN
      # ============================================================

      - name: Install latest Emscripten SDK
        shell: pwsh
        run: |
          $emsdk = "$env:GITHUB_WORKSPACE\emsdk"

          git clone https://github.com/emscripten-core/emsdk.git $emsdk

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to clone Emscripten SDK."
            exit $LASTEXITCODE
          }

          Set-Location $emsdk

          .\emsdk.bat install latest

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Latest Emscripten installation failed."
            exit $LASTEXITCODE
          }

          .\emsdk.bat activate latest

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Latest Emscripten activation failed."
            exit $LASTEXITCODE
          }

      # ============================================================
      # CONFIGURE EMSCRIPTEN
      # ============================================================

      - name: Configure Emscripten environment
        shell: pwsh
        run: |
          $emsdk = "$env:GITHUB_WORKSPACE\emsdk"
          $envScript = "$emsdk\emsdk_env.bat"
          $envFile = "$env:TEMP\emscripten-env.txt"

          cmd /c "`"$envScript`" && set" > $envFile

          Get-Content $envFile | ForEach-Object {
            $line = $_

            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              if (
                $name -ieq "EMSDK" -or
                $name -ieq "EMSDK_NODE" -or
                $name -ieq "EMSDK_PYTHON" -or
                $name -ieq "EM_CONFIG" -or
                $name -ieq "EM_CACHE" -or
                $name -ieq "EMSDK_PIP"
              ) {
                "$name=$value" >> $env:GITHUB_ENV
              }
            }
          }

          $emscriptenDir = Join-Path $emsdk "upstream\emscripten"

          if (-not (Test-Path $emscriptenDir)) {
            Write-Error "Emscripten directory was not found."
            exit 1
          }

          $emscriptenDir >> $env:GITHUB_PATH
          $emsdk >> $env:GITHUB_PATH

      # ============================================================
      # VERIFY EMSCRIPTEN
      # ============================================================

      - name: Verify Emscripten
        shell: pwsh
        run: |
          emcc --version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "emcc is not available."
            exit $LASTEXITCODE
          }

      # ============================================================
      # RUN GODOT SECURE
      # ============================================================

      - name: Run Godot Secure v6
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"
          $godot = "$env:GITHUB_WORKSPACE\godot"

          $answers = @(
            "y"
            "y"
            $env:MAGIC_HEADER
            $env:ENCRYPTED_HEADER
            "n"
            "n"
            "n"
          ) -join "`n"

          $answers | python -X utf8 $script $godot

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Godot Secure failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # ============================================================
      # BUILD WEB RELEASE
      # ============================================================

      - name: Build Web Release Template
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building Web Release Template"
          Write-Host "========================================"

          scons `
            platform=web `
            target=template_release `
            -j2

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Web release template build failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Web release template build completed."

      # ============================================================
      # INSPECT OUTPUT
      # ============================================================

      - name: Inspect Web Release output
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\godot\bin"

          Write-Host "========================================"
          Write-Host "WEB RELEASE OUTPUT"
          Write-Host "========================================"

          $webFiles = Get-ChildItem $bin -Recurse -File |
            Where-Object {
              $_.Name -like "godot.web.template_release*.zip"
            }

          if ($webFiles.Count -eq 0) {
            Write-Error "Web release template ZIP was not found."
            exit 1
          }

          $webFiles |
            Select-Object FullName,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare Web Release artifact
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\godot\bin"
          $artifact = "$env:GITHUB_WORKSPACE\web-release-artifact"

          if (Test-Path $artifact) {
            Remove-Item $artifact -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact |
            Out-Null

          $webRelease = Get-ChildItem $bin -Recurse -File |
            Where-Object {
              $_.Name -like "godot.web.template_release*.zip"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $webRelease) {
            Write-Error "Web release template was not found."
            exit 1
          }

          Copy-Item `
            $webRelease.FullName `
            "$artifact\godot.web.template_release.zip" `
            -Force

          Write-Host "Selected Web release template:"
          Write-Host $webRelease.FullName

      # ============================================================
      # SIZE CHECK
      # ============================================================

      - name: Check artifact size
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\web-release-artifact"

          $files = Get-ChildItem $artifact -Recurse -File

          if ($files.Count -eq 0) {
            Write-Error "Artifact directory is empty."
            exit 1
          }

          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)

          Write-Host "Web Release Template: $mb MB"

          if ($bytes -gt 450MB) {
            Write-Error "Artifact exceeds the 450 MB safety threshold."
            exit 1
          }

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Web Release Template
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Secure-4.7-Web-DotNet-Template-Release
          path: web-release-artifact/
          if-no-files-found: error
          retention-days: 7
