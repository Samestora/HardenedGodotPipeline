name: Build Secure Godot 4.7 .NET Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-editor:
    name: Build Windows Secure .NET Editor
    runs-on: windows-2025

    env:
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_SECURE_KEY }}
      MAGIC_HEADER: ${{ secrets.MAGIC_HEADER }}
      ENCRYPTED_HEADER: ${{ secrets.ENCRYPTED_HEADER }}

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Godot 4.7
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7
          submodules: recursive
          path: godot

      # ============================================================
      # .NET
      # ============================================================
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade scons

          python --version
          scons --version

      # ============================================================
      # DOWNLOAD GODOT SECURE V6
      # ============================================================
      - name: Download Godot Secure v6
        shell: pwsh
        run: |
          $url = "https://github.com/KnifeXRage/Godot-Secure/releases/download/v6.0-Released-Universal/Godot.Secure.AES-256.Universal.v6.py"
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"

          Write-Host "Downloading Godot Secure v6..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $script

          if (-not (Test-Path $script)) {
            Write-Error "Godot Secure script was not downloaded."
            exit 1
          }

          Write-Host "Godot Secure downloaded successfully."

      # ============================================================
      # VALIDATE SECRETS
      # ============================================================
      - name: Validate required secrets
        shell: pwsh
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:SCRIPT_AES256_ENCRYPTION_KEY)) {
            $missing += "GODOT_SECURE_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:MAGIC_HEADER)) {
            $missing += "MAGIC_HEADER"
          }

          if ([string]::IsNullOrWhiteSpace($env:ENCRYPTED_HEADER)) {
            $missing += "ENCRYPTED_HEADER"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required secret(s): $($missing -join ', ')"
            exit 1
          }

          Write-Host "All required secrets are present."

      # ============================================================
      # VALIDATE MAGIC HEADERS
      # ============================================================
      - name: Validate magic headers
        shell: pwsh
        run: |
          if ($env:MAGIC_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "MAGIC_HEADER must contain only letters and numbers."
            exit 1
          }

          if ($env:ENCRYPTED_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "ENCRYPTED_HEADER must contain only letters and numbers."
            exit 1
          }

          Write-Host "Magic headers passed validation."

      # ============================================================
      # ACCESSKIT
      # ============================================================
      - name: Install AccessKit dependencies
        shell: pwsh
        working-directory: godot
        run: |
          python misc/scripts/install_accesskit.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "AccessKit installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "AccessKit installation completed."

      # ============================================================
      # DIRECT3D 12 SDK
      # ============================================================
      - name: Install Direct3D 12 SDK dependencies
        shell: pwsh
        working-directory: godot
        run: |
          python misc/scripts/install_d3d12_sdk_windows.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Direct3D 12 SDK installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "Direct3D 12 SDK installation completed."

      # ============================================================
      # GODOT SECURE
      # ============================================================
      - name: Run Godot Secure v6
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"
          $godot = "$env:GITHUB_WORKSPACE\godot"

          Write-Host "Starting Godot Secure v6..."

          $answers = @(
            "y"
            "y"
            $env:MAGIC_HEADER
            $env:ENCRYPTED_HEADER
            "n"
            "n"
            "n"
          ) -join "`n"

          $answers | python -X utf8 $script $godot

          $exitCode = $LASTEXITCODE

          Write-Host "Godot Secure exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "Godot Secure failed with exit code $exitCode"
            exit $exitCode
          }

          Write-Host "Godot Secure completed successfully."

      # ============================================================
      # BUILD WINDOWS .NET EDITOR
      # ============================================================
      - name: Build Windows .NET Editor
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "Building Windows .NET editor..."

          scons `
            platform=windows `
            target=editor `
            production=yes `
            module_mono_enabled=yes `
            -j2

          $exitCode = $LASTEXITCODE

          Write-Host "SCons exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "Windows .NET editor build failed."
            exit $exitCode
          }

          Write-Host "Windows .NET editor build completed."

      # ============================================================
      # VERIFY MONO EDITOR
      # ============================================================
      - name: Verify .NET Editor binaries
        shell: pwsh
        working-directory: godot
        run: |
          $editor = ".\bin\godot.windows.editor.x86_64.mono.exe"
          $console = ".\bin\godot.windows.editor.x86_64.mono.console.exe"

          Write-Host "Checking:"
          Write-Host "  $editor"
          Write-Host "  $console"

          if (-not (Test-Path $editor)) {
            Write-Error "Mono editor was not found: $editor"
            exit 1
          }

          if (-not (Test-Path $console)) {
            Write-Error "Mono console editor was not found: $console"
            exit 1
          }

          Write-Host "Both .NET editor binaries were found."

      # ============================================================
      # GENERATE MONO GLUE
      # ============================================================
      - name: Generate Mono glue
        shell: pwsh
        working-directory: godot
        run: |
          $editor = ".\bin\godot.windows.editor.x86_64.mono.console.exe"
          $glueDir = ".\modules\mono\glue"

          Write-Host "========================================"
          Write-Host "Generating Mono glue"
          Write-Host "========================================"
          Write-Host "Using editor:"
          Write-Host "  $editor"
          Write-Host ""
          Write-Host "Using glue directory:"
          Write-Host "  $glueDir"
          Write-Host ""

          if (-not (Test-Path $editor)) {
            Write-Error "Mono console editor was not found: $editor"
            exit 1
          }

          if (-not (Test-Path $glueDir)) {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path $glueDir | Out-Null
          }

          Write-Host "Starting Godot glue generation..."

          & $editor `
            --headless `
            --generate-mono-glue `
            "modules/mono/glue"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Mono glue process finished"
          Write-Host "Exit code: $exitCode"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Checking generated API directories..."

          $generatedRuntime = ".\modules\mono\glue\GodotSharp\GodotSharp\Generated"
          $generatedEditor = ".\modules\mono\glue\GodotSharp\GodotSharpEditor\Generated"

          if (Test-Path $generatedRuntime) {
            Write-Host "GodotSharp Generated directory found:"
            Write-Host "  $generatedRuntime"
          }
          else {
            Write-Warning "GodotSharp Generated directory was not found."
          }

          if (Test-Path $generatedEditor) {
            Write-Host "GodotSharpEditor Generated directory found:"
            Write-Host "  $generatedEditor"
          }
          else {
            Write-Warning "GodotSharpEditor Generated directory was not found."
          }

          Write-Host ""
          Write-Host "Glue directory contents:"
          Get-ChildItem `
            -Path $glueDir `
            -Recurse `
            -File |
            Select-Object FullName

          if ($exitCode -ne 0) {
            Write-Error "Mono glue generation failed with exit code $exitCode"
            exit $exitCode
          }

          if (-not (Test-Path $generatedRuntime)) {
            Write-Error "Mono glue generation completed without generating GodotSharp/Generated."
            exit 1
          }

          if (-not (Test-Path $generatedEditor)) {
            Write-Error "Mono glue generation completed without generating GodotSharpEditor/Generated."
            exit 1
          }

          Write-Host ""
          Write-Host "Mono glue generation completed successfully."

      # ============================================================
      # BUILD GODOTSHARP ASSEMBLIES
      # ============================================================
      - name: Build GodotSharp assemblies
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building GodotSharp assemblies"
          Write-Host "========================================"

          python -X utf8 `
            modules/mono/build_scripts/build_assemblies.py `
            --godot-output-dir=./bin `
            --godot-platform=windows

          $exitCode = $LASTEXITCODE

          Write-Host "Assembly build exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "GodotSharp assembly build failed."
            exit $exitCode
          }

          Write-Host "GodotSharp assemblies built successfully."

      # ============================================================
      # VERIFY GODOTSHARP
      # ============================================================
      - name: Verify GodotSharp runtime
        shell: pwsh
        working-directory: godot
        run: |
          $godotSharp = ".\bin\GodotSharp"

          Write-Host "Checking GodotSharp directory..."

          if (-not (Test-Path $godotSharp)) {
            Write-Error "GodotSharp directory was not generated: $godotSharp"
            exit 1
          }

          Write-Host "GodotSharp directory found."

          Get-ChildItem `
            -Path $godotSharp `
            -Recurse `
            -File |
            Select-Object FullName

      # ============================================================
      # CREATE PACKAGE DIRECTORY
      # ============================================================
      - name: Prepare editor package
        shell: pwsh
        working-directory: godot
        run: |
          $package = "$env:GITHUB_WORKSPACE\godot-editor-package"

          if (Test-Path $package) {
            Remove-Item `
              -Recurse `
              -Force `
              $package
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          Write-Host "Copying .NET editor binaries..."

          Copy-Item `
            ".\bin\godot.windows.editor.x86_64.mono.exe" `
            $package

          Copy-Item `
            ".\bin\godot.windows.editor.x86_64.mono.console.exe" `
            $package

          Write-Host "Copying GodotSharp..."

          Copy-Item `
            ".\bin\GodotSharp" `
            "$package\GodotSharp" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Editor package contents:"
          Get-ChildItem `
            -Path $package `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ============================================================
      # CHECK PACKAGE SIZE
      # ============================================================
      - name: Check editor package size
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\godot-editor-package"

          if (-not (Test-Path $package)) {
            Write-Error "Editor package directory does not exist."
            exit 1
          }

          $files = Get-ChildItem `
            -Path $package `
            -Recurse `
            -File

          $sizeBytes = ($files | Measure-Object -Property Length -Sum).Sum
          $sizeMB = [math]::Round($sizeBytes / 1MB, 2)

          Write-Host "Editor package size: $sizeMB MB"

          # Safety limit: 450 MB
          if ($sizeBytes -gt (450MB)) {
            Write-Error "Editor package exceeds the 450 MB safety limit."
            exit 1
          }

      # ============================================================
      # UPLOAD NORMAL .NET EDITOR
      # ============================================================
      - name: Upload .NET Editor
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-secure-windows-dotnet-editor
          path: godot-editor-package
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Build summary
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Godot branch: 4.7"
          Write-Host "Platform: Windows"
          Write-Host "Target: .NET Editor"
          Write-Host "Mono: Enabled"
          Write-Host "AccessKit: Enabled"
          Write-Host "Direct3D 12 SDK: Enabled"
          Write-Host ""
          Write-Host "Artifacts:"
          Write-Host "  godot-4.7-secure-windows-dotnet-editor"
          Write-Host ""
          Write-Host "Binaries:"
          Write-Host "  godot.windows.editor.x86_64.mono.exe"
          Write-Host "  godot.windows.editor.x86_64.mono.console.exe"
          Write-Host ""
          Write-Host "GodotSharp:"
          Write-Host "  Included"
          Write-Host ""
          Write-Host "Retention: 7 days"
          Write-Host "========================================"
