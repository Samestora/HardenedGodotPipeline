name: Build Secure Godot 4.7 .NET Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-editor:
    name: Build Windows Secure .NET Editor
    runs-on: windows-2025

    env:
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_SECURE_KEY }}
      MAGIC_HEADER: ${{ secrets.MAGIC_HEADER }}
      ENCRYPTED_HEADER: ${{ secrets.ENCRYPTED_HEADER }}

      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ============================================================
      # CHECKOUT GODOT
      # ============================================================

      - name: Checkout Godot 4.7
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7
          submodules: recursive
          path: godot


      # ============================================================
      # .NET SDK
      # ============================================================

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info


      # ============================================================
      # PYTHON / SCONS
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade scons

          python --version
          scons --version


      # ============================================================
      # DOWNLOAD GODOT SECURE
      # ============================================================

      - name: Download Godot Secure v6
        shell: pwsh
        run: |
          $url = "https://github.com/KnifeXRage/Godot-Secure/releases/download/v6.0-Released-Universal/Godot.Secure.AES-256.Universal.v6.py"
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $script

          if (-not (Test-Path $script)) {
            Write-Error "Godot Secure script was not downloaded."
            exit 1
          }

          Write-Host "Godot Secure downloaded successfully."


      # ============================================================
      # VALIDATE SECRETS
      # ============================================================

      - name: Validate required secrets
        shell: pwsh
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:SCRIPT_AES256_ENCRYPTION_KEY)) {
            $missing += "GODOT_SECURE_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:MAGIC_HEADER)) {
            $missing += "MAGIC_HEADER"
          }

          if ([string]::IsNullOrWhiteSpace($env:ENCRYPTED_HEADER)) {
            $missing += "ENCRYPTED_HEADER"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required secret(s): $($missing -join ', ')"
            exit 1
          }

          Write-Host "All required secrets are present."


      - name: Validate magic headers
        shell: pwsh
        run: |
          if ($env:MAGIC_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "MAGIC_HEADER must contain only letters and numbers."
            exit 1
          }

          if ($env:ENCRYPTED_HEADER -notmatch '^[A-Za-z0-9]+$') {
            Write-Error "ENCRYPTED_HEADER must contain only letters and numbers."
            exit 1
          }

          Write-Host "Magic headers passed validation."


      # ============================================================
      # WINDOWS DEPENDENCIES
      # ============================================================

      - name: Install AccessKit dependencies
        shell: pwsh
        working-directory: godot
        run: |
          python misc/scripts/install_accesskit.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "AccessKit installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "AccessKit installation completed."


      - name: Install Direct3D 12 SDK dependencies
        shell: pwsh
        working-directory: godot
        run: |
          python misc/scripts/install_d3d12_sdk_windows.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Direct3D 12 SDK installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "Direct3D 12 SDK installation completed."


      # ============================================================
      # GODOT SECURE
      # ============================================================

      - name: Run Godot Secure v6
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\godot_secure.py"
          $godot = "$env:GITHUB_WORKSPACE\godot"

          $answers = @(
            "y"
            "y"
            $env:MAGIC_HEADER
            $env:ENCRYPTED_HEADER
            "n"
            "n"
            "n"
          ) -join "`n"

          Write-Host "========================================"
          Write-Host "Running Godot Secure v6"
          Write-Host "========================================"

          $answers | python -X utf8 $script $godot

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Godot Secure failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Godot Secure completed successfully."


      # ============================================================
      # BUILD .NET EDITOR
      # ============================================================

      - name: Build Windows .NET Editor
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building Windows .NET Editor"
          Write-Host "========================================"

          scons `
            platform=windows `
            target=editor `
            production=yes `
            module_mono_enabled=yes `
            -j2

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Windows .NET editor build failed with exit code $exitCode."
            exit $exitCode
          }

          Write-Host ""
          Write-Host "Windows .NET editor build completed successfully."


      # ============================================================
      # VERIFY GENERATED EDITOR
      # ============================================================

      - name: Verify .NET Editor
        shell: pwsh
        working-directory: godot
        run: |
          $editor = ".\bin\godot.windows.editor.x86_64.mono.exe"
          $console = ".\bin\godot.windows.editor.x86_64.mono.console.exe"

          Write-Host "Checking:"
          Write-Host $editor
          Write-Host $console

          if (-not (Test-Path $editor)) {
            Write-Error "Mono editor was not found: $editor"
            exit 1
          }

          if (-not (Test-Path $console)) {
            Write-Error "Mono console editor was not found: $console"
            exit 1
          }

          Write-Host ""
          Write-Host "Mono editor:"

          Get-Item $editor |
            Select-Object FullName,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

          Write-Host "Mono console editor:"

          Get-Item $console |
            Select-Object FullName,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize


      # ============================================================
      # CLEAN OLD GENERATED GLUE
      # ============================================================

      - name: Clean generated Mono glue
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Cleaning generated Mono glue"
          Write-Host "========================================"

          $glueRoot = ".\modules\mono\glue\GodotSharp"

          if (Test-Path $glueRoot) {
            Remove-Item `
              $glueRoot `
              -Recurse `
              -Force

            Write-Host "Removed previous generated GodotSharp glue."
          }
          else {
            Write-Host "No previous generated glue found."
          }


      # ============================================================
      # GENERATE MONO GLUE
      # ============================================================

      - name: Generate Mono glue
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Generating Mono glue"
          Write-Host "========================================"

          $editor = ".\bin\godot.windows.editor.x86_64.mono.exe"
          $glueDir = ".\modules\mono\glue"

          if (-not (Test-Path $editor)) {
            Write-Error "Mono editor was not found: $editor"
            exit 1
          }

          if (-not (Test-Path $glueDir)) {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path $glueDir | Out-Null
          }

          Write-Host "Using editor:"
          Write-Host $editor

          Write-Host ""
          Write-Host "Using glue directory:"
          Write-Host $glueDir

          Write-Host ""
          Write-Host "Starting Godot glue generation..."
          Write-Host ""

          & $editor `
            --headless `
            --generate-mono-glue `
            "$glueDir"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Mono glue process finished"
          Write-Host "Exit code: $exitCode"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Checking generated API directories..."

          $apiDir = ".\modules\mono\glue\GodotSharp\GodotSharp\Generated"
          $editorApiDir = ".\modules\mono\glue\GodotSharp\GodotSharpEditor\Generated"

          if (Test-Path $apiDir) {
            $apiFiles = Get-ChildItem `
              $apiDir `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue

            Write-Host "GodotSharp generated files: $($apiFiles.Count)"
          }
          else {
            Write-Host "GodotSharp Generated directory was not found."
          }

          if (Test-Path $editorApiDir) {
            $editorApiFiles = Get-ChildItem `
              $editorApiDir `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue

            Write-Host "GodotSharpEditor generated files: $($editorApiFiles.Count)"
          }
          else {
            Write-Host "GodotSharpEditor Generated directory was not found."
          }

          Write-Host ""
          Write-Host "Glue directory contents:"

          Get-ChildItem `
            $glueDir `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName,
              @{Name="SizeKB";Expression={[math]::Round($_.Length / 1KB, 2)}} |
            Format-Table -AutoSize

          if ($exitCode -ne 0) {
            Write-Error "Mono glue generation failed with exit code $exitCode."
            exit $exitCode
          }

          if (-not (Test-Path $apiDir)) {
            Write-Error "GodotSharp generated API directory was not created."
            exit 1
          }

          if (-not (Test-Path $editorApiDir)) {
            Write-Error "GodotSharpEditor generated API directory was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "Mono glue generation completed successfully."


      # ============================================================
      # BUILD GODOTSHARP
      # ============================================================

      - name: Build GodotSharp assemblies
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Building GodotSharp assemblies"
          Write-Host "========================================"

          python -X utf8 `
            modules/mono/build_scripts/build_assemblies.py `
            --godot-output-dir=./bin `
            --godot-platform=windows

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "build_assemblies.py exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "GodotSharp assembly build failed with exit code $exitCode."
            exit $exitCode
          }

          if (-not (Test-Path ".\bin\GodotSharp")) {
            Write-Error "GodotSharp directory was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "GodotSharp assemblies built successfully."


      # ============================================================
      # INSPECT FINAL OUTPUT
      # ============================================================

      - name: Inspect .NET editor output
        shell: pwsh
        working-directory: godot
        run: |
          Write-Host "========================================"
          Write-Host "Final .NET editor output"
          Write-Host "========================================"

          $bin = ".\bin"

          Write-Host ""
          Write-Host "Executables:"

          Get-ChildItem `
            $bin `
            -File |
            Where-Object {
              $_.Name -like "godot.windows.editor.x86_64.mono*"
            } |
            Select-Object Name,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "GodotSharp contents:"

          if (Test-Path "$bin\GodotSharp") {
            Get-ChildItem `
              "$bin\GodotSharp" `
              -Recurse `
              -File |
              Select-Object FullName,
                @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
              Format-Table -AutoSize
          }
          else {
            Write-Error "GodotSharp directory does not exist."
            exit 1
          }

          if (-not (Test-Path "$bin\godot.windows.editor.x86_64.mono.exe")) {
            Write-Error "Normal .NET editor executable was not found."
            exit 1
          }

          if (-not (Test-Path "$bin\godot.windows.editor.x86_64.mono.console.exe")) {
            Write-Error "Console .NET editor executable was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "All required .NET editor files exist."


      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare .NET editor artifact
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\godot\bin"
          $artifact = "$env:GITHUB_WORKSPACE\editor-artifact"

          if (Test-Path $artifact) {
            Remove-Item `
              $artifact `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact | Out-Null

          Copy-Item `
            "$bin\godot.windows.editor.x86_64.mono.exe" `
            "$artifact\" `
            -Force

          Copy-Item `
            "$bin\godot.windows.editor.x86_64.mono.console.exe" `
            "$artifact\" `
            -Force

          Copy-Item `
            "$bin\GodotSharp" `
            "$artifact\GodotSharp" `
            -Recurse `
            -Force

          Write-Host "========================================"
          Write-Host "Final artifact contents"
          Write-Host "========================================"

          Get-ChildItem `
            $artifact `
            -Recurse `
            -File |
            Select-Object FullName,
              @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize


      # ============================================================
      # ARTIFACT SIZE
      # ============================================================

      - name: Check editor artifact size
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\editor-artifact"

          $files = Get-ChildItem `
            $artifact `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
            Write-Error "Editor artifact is empty."
            exit 1
          }

          $bytes = (
            $files |
            Measure-Object `
              -Property Length `
              -Sum
          ).Sum

          $mb = [math]::Round(
            $bytes / 1MB,
            2
          )

          Write-Host "Total .NET editor artifact: $mb MB"

          if ($bytes -gt 450MB) {
            Write-Error "Editor artifact exceeds the 450 MB safety threshold."
            exit 1
          }


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Windows .NET Editor
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Secure-4.7-Windows-DotNet-Editor
          path: editor-artifact/
          if-no-files-found: error
          retention-days: 7
