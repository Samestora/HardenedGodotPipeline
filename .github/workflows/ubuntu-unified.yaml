name: Godot Secure 4.7 - Unified Ubuntu Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-all:
    name: Secure Once + Build All Targets
    runs-on: ubuntu-latest

    env:
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_SECURE_KEY }}
      MAGIC_HEADER: ${{ secrets.MAGIC_HEADER }}
      ENCRYPTED_HEADER: ${{ secrets.ENCRYPTED_HEADER }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:

      # ============================================================
      # CHECKOUT GODOT 4.7
      # ============================================================

      - name: Checkout Godot 4.7
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7
          submodules: recursive
          path: godot

      - name: Show Godot version and commit
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "GODOT SOURCE"
          echo "========================================"

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Version:"
          git describe --tags --always --dirty

          echo ""
          echo "Git status:"
          git status --short


      # ============================================================
      # UBUNTU DEPENDENCIES
      # ============================================================

      - name: Install Ubuntu build dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL UBUNTU BUILD DEPENDENCIES"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gcc \
            g++ \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            git \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            cmake \
            ninja-build \
            ccache \
            mingw-w64 \
            mingw-w64-tools \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            xorg-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxext-dev \
            libxfixes-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libdrm-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libspeechd-dev

          echo ""
          echo "Ubuntu dependencies installed."


      # ============================================================
      # PYTHON / SCONS
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade scons

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "SCons:"
          scons --version


      # ============================================================
      # MINGW POSIX THREADING
      # ============================================================

      - name: Configure MinGW POSIX threading
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURE MINGW POSIX THREADING"
          echo "========================================"

          GCC_POSIX="/usr/bin/x86_64-w64-mingw32-gcc-posix"
          GPP_POSIX="/usr/bin/x86_64-w64-mingw32-g++-posix"

          if [ ! -x "$GCC_POSIX" ]; then
            echo "ERROR: POSIX GCC not found:"
            echo "$GCC_POSIX"
            exit 1
          fi

          if [ ! -x "$GPP_POSIX" ]; then
            echo "ERROR: POSIX G++ not found:"
            echo "$GPP_POSIX"
            exit 1
          fi

          sudo update-alternatives \
            --set x86_64-w64-mingw32-gcc \
            "$GCC_POSIX"

          sudo update-alternatives \
            --set x86_64-w64-mingw32-g++ \
            "$GPP_POSIX"

          echo ""
          echo "GCC:"
          x86_64-w64-mingw32-gcc --version

          echo ""
          echo "G++:"
          x86_64-w64-mingw32-g++ --version

          echo ""
          echo "Resolved GCC:"
          readlink -f "$(command -v x86_64-w64-mingw32-gcc)"

          echo ""
          echo "Resolved G++:"
          readlink -f "$(command -v x86_64-w64-mingw32-g++)"

          GCC_PATH="$(readlink -f "$(command -v x86_64-w64-mingw32-gcc)")"
          GPP_PATH="$(readlink -f "$(command -v x86_64-w64-mingw32-g++)")"

          if [[ "$GCC_PATH" != *"-posix" ]]; then
            echo "ERROR: GCC is not using POSIX threads."
            exit 1
          fi

          if [[ "$GPP_PATH" != *"-posix" ]]; then
            echo "ERROR: G++ is not using POSIX threads."
            exit 1
          fi

          echo ""
          echo "MinGW POSIX configuration complete."


      # ============================================================
      # VALIDATE SECRETS
      # ============================================================

      - name: Validate required secrets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATE REQUIRED SECRETS"
          echo "========================================"

          missing=()

          if [ -z "$SCRIPT_AES256_ENCRYPTION_KEY" ]; then
            missing+=("GODOT_SECURE_KEY")
          fi

          if [ -z "$MAGIC_HEADER" ]; then
            missing+=("MAGIC_HEADER")
          fi

          if [ -z "$ENCRYPTED_HEADER" ]; then
            missing+=("ENCRYPTED_HEADER")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo ""
            echo "Missing required secret(s):"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          echo ""
          echo "All required secrets are present."


      # ============================================================
      # VALIDATE MAGIC HEADERS
      # ============================================================

      - name: Validate magic headers
        shell: bash
        run: |
          set -e

          if [[ ! "$MAGIC_HEADER" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "ERROR: MAGIC_HEADER must contain only letters and numbers."
            exit 1
          fi

          if [[ ! "$ENCRYPTED_HEADER" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "ERROR: ENCRYPTED_HEADER must contain only letters and numbers."
            exit 1
          fi

          echo "Magic headers passed validation."


      # ============================================================
      # WINDOWS CROSS-COMPILATION DEPENDENCIES
      # ============================================================

      - name: Install Windows cross-compilation dependencies
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "INSTALL WINDOWS CROSS-COMPILATION"
          echo "DEPENDENCIES"
          echo "========================================"

          echo ""
          echo "[1/4] Installing WinRT..."
          python3 misc/scripts/install_winrt.py

          echo ""
          echo "[2/4] Installing AccessKit..."
          python3 misc/scripts/install_accesskit.py

          echo ""
          echo "[3/4] Installing D3D12 SDK..."
          python3 misc/scripts/install_d3d12_sdk_windows.py \
            --mingw_prefix=/usr

          echo ""
          echo "[4/4] Installing ANGLE..."
          python3 misc/scripts/install_angle.py

          echo ""
          echo "Windows cross-compilation dependencies installed."


      # ============================================================
      # DOWNLOAD GODOT SECURE V6
      # ============================================================

      - name: Download Godot Secure v6
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOAD GODOT SECURE V6"
          echo "========================================"

          URL="https://github.com/KnifeXRage/Godot-Secure/releases/download/v6.0-Released-Universal/Godot.Secure.AES-256.Universal.v6.py"
          SCRIPT="$GITHUB_WORKSPACE/godot_secure.py"

          curl \
            -L \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            "$URL" \
            -o "$SCRIPT"

          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: Godot Secure script was not downloaded."
            exit 1
          fi

          echo ""
          echo "Godot Secure downloaded:"
          ls -lh "$SCRIPT"


      # ============================================================
      # RUN GODOT SECURE EXACTLY ONCE
      # ============================================================

      - name: Run Godot Secure v6 ONCE
        shell: bash
        run: |
          set -e

          SCRIPT="$GITHUB_WORKSPACE/godot_secure.py"
          GODOT="$GITHUB_WORKSPACE/godot"

          echo "========================================"
          echo "RUN GODOT SECURE V6"
          echo "========================================"

          echo ""
          echo "IMPORTANT:"
          echo "Godot Secure runs exactly ONCE."
          echo "All targets use this same secured source tree."
          echo ""

          printf '%s\n' \
            "y" \
            "y" \
            "$MAGIC_HEADER" \
            "$ENCRYPTED_HEADER" \
            "n" \
            "n" \
            "n" \
            | python3 -X utf8 "$SCRIPT" "$GODOT"

          echo ""
          echo "Godot Secure completed successfully."


      # ============================================================
      # VERIFY SECURED SOURCE
      # ============================================================

      - name: Verify secured source tree
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "VERIFY SECURED SOURCE TREE"
          echo "========================================"

          echo ""
          echo "Godot commit:"
          git rev-parse HEAD

          echo ""
          echo "Git status:"
          git status --short || true

          echo ""
          echo "Secured source tree is ready."


      # ============================================================
      # BUILD LINUX RELEASE
      # ============================================================

      - name: Build Linux x86_64 release
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "BUILD LINUX X86_64 RELEASE"
          echo "========================================"

          scons \
            platform=linuxbsd \
            target=template_release \
            arch=x86_64 \
            production=yes \
            -j2

          echo ""
          echo "Linux build completed."


      # ============================================================
      # VERIFY LINUX
      # ============================================================

      - name: Verify Linux release
        shell: bash
        working-directory: godot
        run: |
          set -e

          FILE="bin/godot.linuxbsd.template_release.x86_64"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Linux release not found:"
            echo "$FILE"

            echo ""
            echo "Available Linux binaries:"
            find bin -maxdepth 1 -type f \
              -iname '*linux*' \
              -printf '%f\n' \
              | sort || true

            exit 1
          fi

          echo ""
          echo "Linux release:"
          ls -lh "$FILE"


      # ============================================================
      # BUILD WINDOWS NON-MONO EDITOR
      # ============================================================

      - name: Build Windows non-Mono editor
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "BUILD WINDOWS NON-MONO EDITOR"
          echo "========================================"

          echo ""
          echo "Compiler:"
          x86_64-w64-mingw32-g++ --version | head -n 1

          echo ""
          echo "Compiler path:"
          readlink -f "$(command -v x86_64-w64-mingw32-g++)"

          scons \
            platform=windows \
            target=editor \
            arch=x86_64 \
            use_mingw=yes \
            production=yes \
            -j2

          echo ""
          echo "Windows editor build completed."


      # ============================================================
      # BUILD WINDOWS RELEASE
      # ============================================================

      - name: Build Windows x86_64 release
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "BUILD WINDOWS X86_64 RELEASE"
          echo "========================================"

          echo ""
          echo "Compiler:"
          x86_64-w64-mingw32-g++ --version | head -n 1

          echo ""
          echo "Compiler path:"
          readlink -f "$(command -v x86_64-w64-mingw32-g++)"

          scons \
            platform=windows \
            target=template_release \
            arch=x86_64 \
            use_mingw=yes \
            production=yes \
            -j2

          echo ""
          echo "Windows release build completed."


      # ============================================================
      # VERIFY WINDOWS
      # ============================================================

      - name: Verify Windows outputs
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "VERIFY WINDOWS OUTPUTS"
          echo "========================================"

          FILES=(
            "bin/godot.windows.editor.x86_64.exe"
            "bin/godot.windows.editor.x86_64.console.exe"
            "bin/godot.windows.template_release.x86_64.exe"
            "bin/godot.windows.template_release.x86_64.console.exe"
          )

          for FILE in "${FILES[@]}"; do
            echo ""
            echo "Checking:"
            echo "$FILE"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing Windows output:"
              echo "$FILE"

              echo ""
              echo "Available Windows files:"
              find bin -maxdepth 1 -type f \
                -iname '*windows*' \
                -printf '%f\n' \
                | sort || true

              exit 1
            fi

            ls -lh "$FILE"
          done

          echo ""
          echo "All Windows outputs found."


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # ANDROID SDK / NDK
      # ============================================================

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL ANDROID SDK / NDK"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not set."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"

            echo ""
            echo "Searching:"
            find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

          echo ""
          echo "Android SDK / NDK installed."


      # ============================================================
      # VERIFY ANDROID ENVIRONMENT
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY ANDROID ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          "$ANDROID_HOME/platform-tools/adb" version

          echo ""
          echo "NDK:"
          ls -ld "$ANDROID_HOME/ndk/28.1.13356709"

          echo ""
          echo "CMake:"
          ls -ld "$ANDROID_HOME/cmake/3.10.2.4988404"

          echo ""
          echo "Build Tools:"
          ls -ld "$ANDROID_HOME/build-tools/35.0.1"

          echo ""
          echo "Android Platform:"
          ls -ld "$ANDROID_HOME/platforms/android-35"


      # ============================================================
      # BUILD ANDROID ARM32
      # ============================================================

      - name: Build Android release ARM32
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "BUILD ANDROID ARM32 RELEASE"
          echo "========================================"

          scons \
            platform=android \
            target=template_release \
            arch=arm32 \
            production=yes \
            -j2

          echo ""
          echo "Android ARM32 build completed."


      # ============================================================
      # BUILD ANDROID ARM64
      # ============================================================

      - name: Build Android release ARM64
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "BUILD ANDROID ARM64 RELEASE"
          echo "========================================"

          scons \
            platform=android \
            target=template_release \
            arch=arm64 \
            production=yes \
            generate_android_binaries=yes \
            -j2

          echo ""
          echo "Android ARM64 build completed."


      # ============================================================
      # VERIFY ANDROID
      # ============================================================

      - name: Verify Android release
        shell: bash
        working-directory: godot
        run: |
          set -e

          FILE="bin/android_release.apk"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Android APK not found:"
            echo "$FILE"

            echo ""
            echo "Available Android files:"
            find bin -maxdepth 1 -type f \
              -iname '*android*' \
              -printf '%f\n' \
              | sort || true

            exit 1
          fi

          echo ""
          echo "Android APK:"
          ls -lh "$FILE"


      # ============================================================
      # EMSCRIPTEN
      # ============================================================

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.0"
          actions-cache-folder: "emsdk-cache"


      # ============================================================
      # VERIFY EMSCRIPTEN
      # ============================================================

      - name: Verify Emscripten
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY EMSCRIPTEN"
          echo "========================================"

          echo ""
          echo "emcc:"
          command -v emcc

          echo ""
          echo "em++:"
          command -v em++

          echo ""
          emcc --version


      # ============================================================
      # BUILD WEB RELEASE
      # ============================================================

      - name: Build Web release
        shell: bash
        working-directory: godot
        run: |
          set -e

          echo "========================================"
          echo "BUILD WEB RELEASE"
          echo "========================================"

          scons \
            platform=web \
            target=template_release \
            arch=wasm32 \
            production=yes \
            -j2

          echo ""
          echo "Web build completed."


      # ============================================================
      # PREPARE WEB RELEASE
      # ============================================================

      - name: Prepare Web release
        shell: bash
        working-directory: godot
        run: |
          set -e

          SOURCE="bin/godot.web.template_release.wasm32.zip"
          TARGET="bin/web_release.zip"

          echo "========================================"
          echo "PREPARE WEB RELEASE"
          echo "========================================"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Web release template not found:"
            echo "$SOURCE"

            echo ""
            echo "Available Web/WASM files:"
            find bin -maxdepth 1 -type f \
              \( -iname '*web*' -o -iname '*wasm*' \) \
              -printf '%f\n' \
              | sort || true

            exit 1
          fi

          rm -f "$TARGET"
          mv "$SOURCE" "$TARGET"

          echo ""
          echo "Web release:"
          ls -lh "$TARGET"


      # ============================================================
      # FINAL PACKAGE
      # ============================================================

      - name: Prepare final release package
        shell: bash
        working-directory: godot
        run: |
          set -e

          PACKAGE="$GITHUB_WORKSPACE/godot-secure-4.7-unified-release"

          echo "========================================"
          echo "PREPARE FINAL RELEASE PACKAGE"
          echo "========================================"

          rm -rf "$PACKAGE"

          mkdir -p \
            "$PACKAGE/windows-editor" \
            "$PACKAGE/windows-release" \
            "$PACKAGE/linux-release" \
            "$PACKAGE/android-release" \
            "$PACKAGE/web-release"

          # Windows editor
          cp \
            bin/godot.windows.editor.x86_64.exe \
            "$PACKAGE/windows-editor/"

          cp \
            bin/godot.windows.editor.x86_64.console.exe \
            "$PACKAGE/windows-editor/"

          # Windows release
          cp \
            bin/godot.windows.template_release.x86_64.exe \
            "$PACKAGE/windows-release/"

          cp \
            bin/godot.windows.template_release.x86_64.console.exe \
            "$PACKAGE/windows-release/"

          # Linux
          cp \
            bin/godot.linuxbsd.template_release.x86_64 \
            "$PACKAGE/linux-release/"

          # Android
          cp \
            bin/android_release.apk \
            "$PACKAGE/android-release/"

          # Web
          cp \
            bin/web_release.zip \
            "$PACKAGE/web-release/"

          echo ""
          echo "Final package:"
          find "$PACKAGE" \
            -type f \
            -printf '%p %s bytes\n' \
            | sort


      # ============================================================
      # VERIFY FINAL ARTIFACTS
      # ============================================================

      - name: Verify final artifacts
        shell: bash
        run: |
          set -e

          PACKAGE="$GITHUB_WORKSPACE/godot-secure-4.7-unified-release"

          echo "========================================"
          echo "VERIFY FINAL ARTIFACTS"
          echo "========================================"

          REQUIRED_FILES=(
            "$PACKAGE/windows-editor/godot.windows.editor.x86_64.exe"
            "$PACKAGE/windows-editor/godot.windows.editor.x86_64.console.exe"

            "$PACKAGE/windows-release/godot.windows.template_release.x86_64.exe"
            "$PACKAGE/windows-release/godot.windows.template_release.x86_64.console.exe"

            "$PACKAGE/linux-release/godot.linuxbsd.template_release.x86_64"

            "$PACKAGE/android-release/android_release.apk"

            "$PACKAGE/web-release/web_release.zip"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo ""
              echo "ERROR: Missing required artifact:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $(basename "$FILE")"
          done

          echo ""
          echo "All required artifacts are present."


      # ============================================================
      # UPLOAD FINAL ARTIFACT
      # ============================================================

      - name: Upload unified release
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-secure-unified-ubuntu
          path: godot-secure-4.7-unified-release
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GODOT SECURE 4.7 BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "Godot: 4.7"
          echo "Godot Secure: v6"
          echo "Secure executions: 1"
          echo ""
          echo "Windows Editor:"
          echo "  x86_64"
          echo "  Non-Mono / Non-.NET"
          echo "  MinGW-w64 POSIX"
          echo ""
          echo "Windows Release:"
          echo "  x86_64"
          echo "  MinGW-w64 POSIX"
          echo ""
          echo "Linux Release:"
          echo "  x86_64"
          echo ""
          echo "Android:"
          echo "  ARM32 + ARM64"
          echo ""
          echo "Web:"
          echo "  wasm32"
          echo ""
          echo "Artifact:"
          echo "  godot-4.7-secure-unified-ubuntu"
          echo ""
          echo "========================================"
