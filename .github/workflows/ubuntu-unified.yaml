name: Godot Secure 4.7 - Unified Ubuntu Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_SECURE_KEY }}
  MAGIC_HEADER: ${{ secrets.MAGIC_HEADER }}
  ENCRYPTED_HEADER: ${{ secrets.ENCRYPTED_HEADER }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-all:
    name: Secure Once + Build All Targets
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT OFFICIAL GODOT 4.7
      # ============================================================

      - name: Checkout Godot 4.7
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7
          submodules: recursive
          path: godot

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gcc \
            g++ \
            python3 \
            python3-pip \
            python3-dev \
            git \
            curl \
            unzip \
            zip \
            rsync \
            cmake \
            ninja-build \
            ccache \
            mingw-w64 \
            mingw-w64-tools \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libspeechd-dev

      # ============================================================
      # PYTHON 3.12
      # ============================================================

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install scons

          python --version
          scons --version

      # ============================================================
      # MINGW POSIX THREADING
      # ============================================================

      - name: Configure MinGW POSIX toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURING MINGW POSIX TOOLCHAIN"
          echo "========================================"

          GCC_POSIX="/usr/bin/x86_64-w64-mingw32-gcc-posix"
          GPP_POSIX="/usr/bin/x86_64-w64-mingw32-g++-posix"

          if [ ! -x "$GCC_POSIX" ]; then
            echo "ERROR: POSIX GCC not found:"
            echo "$GCC_POSIX"
            exit 1
          fi

          if [ ! -x "$GPP_POSIX" ]; then
            echo "ERROR: POSIX G++ not found:"
            echo "$GPP_POSIX"
            exit 1
          fi

          sudo update-alternatives --set \
            x86_64-w64-mingw32-gcc \
            "$GCC_POSIX"

          sudo update-alternatives --set \
            x86_64-w64-mingw32-g++ \
            "$GPP_POSIX"

          echo ""
          echo "Resolved GCC:"
          readlink -f "$(command -v x86_64-w64-mingw32-gcc)"

          echo ""
          echo "Resolved G++:"
          readlink -f "$(command -v x86_64-w64-mingw32-g++)"

          echo ""
          echo "GCC version:"
          x86_64-w64-mingw32-gcc --version

          echo ""
          echo "G++ version:"
          x86_64-w64-mingw32-g++ --version

          GCC_REAL="$(readlink -f "$(command -v x86_64-w64-mingw32-gcc)")"
          GPP_REAL="$(readlink -f "$(command -v x86_64-w64-mingw32-g++)")"

          case "$GCC_REAL" in
            *-posix) ;;
            *)
              echo "ERROR: GCC is NOT using POSIX threading."
              echo "$GCC_REAL"
              exit 1
              ;;
          esac

          case "$GPP_REAL" in
            *-posix) ;;
            *)
              echo "ERROR: G++ is NOT using POSIX threading."
              echo "$GPP_REAL"
              exit 1
              ;;
          esac

          echo ""
          echo "MinGW POSIX toolchain configured successfully."

      # ============================================================
      # VALIDATE SECRETS
      # ============================================================

      - name: Validate Secure secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDATING SECURE CONFIGURATION"
          echo "========================================"

          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: GODOT_SECURE_KEY secret is empty."
            exit 1
          fi

          if [ -z "${MAGIC_HEADER:-}" ]; then
            echo "ERROR: MAGIC_HEADER secret is empty."
            exit 1
          fi

          if [ -z "${ENCRYPTED_HEADER:-}" ]; then
            echo "ERROR: ENCRYPTED_HEADER secret is empty."
            exit 1
          fi

          echo "Secure encryption key: configured"
          echo "Magic header: $MAGIC_HEADER"
          echo "Encrypted header: $ENCRYPTED_HEADER"

      # ============================================================
      # INSTALL WINDOWS BUILD DEPENDENCIES
      # ============================================================

      - name: Install Windows build dependencies
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING WINDOWS DEPENDENCIES"
          echo "========================================"

          python misc/scripts/install_winrt.py

          python misc/scripts/install_accesskit.py

          python misc/scripts/install_d3d12_sdk_windows.py \
            --mingw_prefix=/usr

          python misc/scripts/install_angle.py

          echo ""
          echo "Windows dependencies installed."

      # ============================================================
      # DOWNLOAD GODOT SECURE V6
      # ============================================================

      - name: Download Godot Secure v6
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DOWNLOADING GODOT SECURE V6"
          echo "========================================"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o godot-secure.py \
            "https://github.com/KnifeXRage/Godot-Secure/releases/download/v6.0-Released-Universal/Godot.Secure.AES-256.Universal.v6.py"

          test -s godot-secure.py

          echo ""
          echo "Godot Secure downloaded:"
          ls -lh godot-secure.py

      # ============================================================
      # RUN GODOT SECURE EXACTLY ONCE
      # ============================================================

      - name: Secure Godot source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RUNNING GODOT SECURE V6"
          echo "========================================"
          echo ""
          echo "IMPORTANT:"
          echo "Godot Secure is executed exactly once."
          echo "Every platform will be built from this same"
          echo "secured source tree."
          echo ""

          printf '%s\n' \
            "y" \
            "y" \
            "$MAGIC_HEADER" \
            "$ENCRYPTED_HEADER" \
            "n" \
            "n" \
            "n" \
            | python -X utf8 \
                godot-secure.py \
                godot

          echo ""
          echo "========================================"
          echo "SECURE PROCESS FINISHED"
          echo "========================================"

      # ============================================================
      # BUILD LINUX
      # ============================================================

      - name: Build Linux release
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING LINUX X86_64 RELEASE"
          echo "========================================"

          scons \
            platform=linuxbsd \
            target=template_release \
            arch=x86_64 \
            production=yes \
            -j2

          test -f bin/godot.linuxbsd.template_release.x86_64

          echo ""
          echo "Linux build complete:"
          ls -lh bin/godot.linuxbsd.template_release.x86_64

      # ============================================================
      # BUILD WINDOWS EDITOR
      # ============================================================

      - name: Build Windows editor
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING WINDOWS EDITOR X86_64"
          echo "========================================"

          scons \
            platform=windows \
            target=editor \
            arch=x86_64 \
            use_mingw=yes \
            production=yes \
            -j2

          test -f bin/godot.windows.editor.x86_64.exe
          test -f bin/godot.windows.editor.x86_64.console.exe

          echo ""
          echo "Windows editor build complete:"
          ls -lh \
            bin/godot.windows.editor.x86_64.exe \
            bin/godot.windows.editor.x86_64.console.exe

      # ============================================================
      # BUILD WINDOWS RELEASE
      # ============================================================

      - name: Build Windows release
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING WINDOWS X86_64 RELEASE"
          echo "========================================"

          scons \
            platform=windows \
            target=template_release \
            arch=x86_64 \
            use_mingw=yes \
            production=yes \
            -j2

          test -f bin/godot.windows.template_release.x86_64.exe
          test -f bin/godot.windows.template_release.x86_64.console.exe

          echo ""
          echo "Windows release build complete:"
          ls -lh \
            bin/godot.windows.template_release.x86_64.exe \
            bin/godot.windows.template_release.x86_64.console.exe

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK / NDK
      #
      # Do NOT use android-actions/setup-android@v3.
      # GitHub's runner already provides the Android SDK and
      # sdkmanager. The setup-android action can attempt to install
      # the obsolete "tools" package.
      # ============================================================

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ANDROID SDK / NDK SETUP"
          echo "========================================"

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo ""
            echo "ERROR: Android SDK directory not found:"
            echo "$SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -path '*/bin/sdkmanager' \
              -print \
              2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo ""
            echo "ERROR: sdkmanager not found under:"
            echo "$SDK_ROOT"

            echo ""
            echo "Available sdkmanager files:"
            find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDK Manager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Exporting Android environment..."

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null || true

          echo ""
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

          echo ""
          echo "Android SDK / NDK installation complete."

      # ============================================================
      # VERIFY ANDROID
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY ANDROID ENVIRONMENT"
          echo "========================================"

          : "${ANDROID_HOME:?ANDROID_HOME is not set}"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          "$ANDROID_HOME/platform-tools/adb" version

          echo ""
          echo "NDK:"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          ls -ld "$ANDROID_HOME/ndk/28.1.13356709"

          echo ""
          echo "CMake:"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          ls -ld "$ANDROID_HOME/cmake/3.10.2.4988404"

          echo ""
          echo "Build Tools:"
          test -d "$ANDROID_HOME/build-tools/35.0.1"
          ls -ld "$ANDROID_HOME/build-tools/35.0.1"

          echo ""
          echo "Android Platform:"
          test -d "$ANDROID_HOME/platforms/android-35"
          ls -ld "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Android environment is ready."

      # ============================================================
      # BUILD ANDROID ARM32
      # ============================================================

      - name: Build Android release ARM32
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING ANDROID ARM32 RELEASE"
          echo "========================================"

          scons \
            platform=android \
            target=template_release \
            arch=arm32 \
            production=yes \
            -j2

          echo ""
          echo "Android ARM32 build finished."

      # ============================================================
      # BUILD ANDROID ARM64
      # ============================================================

      - name: Build Android release ARM64
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING ANDROID ARM64 RELEASE"
          echo "========================================"

          scons \
            platform=android \
            target=template_release \
            arch=arm64 \
            production=yes \
            generate_android_binaries=yes \
            -j2

          test -f bin/android_release.apk

          echo ""
          echo "Android release build complete:"
          ls -lh bin/android_release.apk

      # ============================================================
      # EMSCRIPTEN / WEB
      # ============================================================

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.0"
          actions-cache-folder: "emsdk-cache"

      - name: Verify Emscripten
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY EMSCRIPTEN"
          echo "========================================"

          emcc --version

      # ============================================================
      # BUILD WEB
      # ============================================================

      - name: Build Web release
        working-directory: godot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING WEB WASM32 RELEASE"
          echo "========================================"

          scons \
            platform=web \
            target=template_release \
            arch=wasm32 \
            production=yes \
            -j2

          test -f bin/godot.web.template_release.wasm32.zip

          cp \
            bin/godot.web.template_release.wasm32.zip \
            bin/web_release.zip

          echo ""
          echo "Web release build complete:"
          ls -lh bin/web_release.zip

      # ============================================================
      # PREPARE RELEASE DIRECTORY
      # ============================================================

      - name: Prepare unified release package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING UNIFIED RELEASE"
          echo "========================================"

          RELEASE="godot-secure-4.7-unified-release"

          rm -rf "$RELEASE"

          mkdir -p \
            "$RELEASE/windows-editor" \
            "$RELEASE/windows-release" \
            "$RELEASE/linux-release" \
            "$RELEASE/android-release" \
            "$RELEASE/web-release"

          # Windows editor
          cp \
            godot/bin/godot.windows.editor.x86_64.exe \
            "$RELEASE/windows-editor/"

          cp \
            godot/bin/godot.windows.editor.x86_64.console.exe \
            "$RELEASE/windows-editor/"

          # Windows release
          cp \
            godot/bin/godot.windows.template_release.x86_64.exe \
            "$RELEASE/windows-release/"

          cp \
            godot/bin/godot.windows.template_release.x86_64.console.exe \
            "$RELEASE/windows-release/"

          # Linux release
          cp \
            godot/bin/godot.linuxbsd.template_release.x86_64 \
            "$RELEASE/linux-release/"

          # Android
          cp \
            godot/bin/android_release.apk \
            "$RELEASE/android-release/"

          # Web
          cp \
            godot/bin/web_release.zip \
            "$RELEASE/web-release/"

          echo ""
          echo "Release package:"
          find "$RELEASE" \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate final release package
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL RELEASE VALIDATION"
          echo "========================================"

          RELEASE="godot-secure-4.7-unified-release"

          test -f "$RELEASE/windows-editor/godot.windows.editor.x86_64.exe"
          test -f "$RELEASE/windows-editor/godot.windows.editor.x86_64.console.exe"

          test -f "$RELEASE/windows-release/godot.windows.template_release.x86_64.exe"
          test -f "$RELEASE/windows-release/godot.windows.template_release.x86_64.console.exe"

          test -f "$RELEASE/linux-release/godot.linuxbsd.template_release.x86_64"

          test -f "$RELEASE/android-release/android_release.apk"

          test -f "$RELEASE/web-release/web_release.zip"

          echo ""
          echo "All required release files exist."
          echo ""

          du -sh "$RELEASE"

          echo ""
          echo "Final files:"
          find "$RELEASE" \
            -type f \
            -printf '%p  %s bytes\n' \
            | sort

      # ============================================================
      # UPLOAD ONLY FINISHED BINARIES
      # ============================================================

      - name: Upload unified release
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-secure-unified-ubuntu
          path: godot-secure-4.7-unified-release
          if-no-files-found: error
          retention-days: 7
